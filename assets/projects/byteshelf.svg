<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 206" width="560" height="206" role="img" aria-label="ByteShelf">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1020"/><stop offset="1" stop-color="#0D1117"/></linearGradient>
    <radialGradient id="glow" cx="1" cy="0" r="1"><stop offset="0" stop-color="#A78BFA" stop-opacity=".28"/><stop offset=".6" stop-color="#A78BFA" stop-opacity="0"/></radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A78BFA" stop-opacity=".6"/><stop offset=".45" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity=".05"/></linearGradient>
    <linearGradient id="sheen" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".06"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <clipPath id="c"><rect width="560" height="206" rx="20"/></clipPath>
  </defs>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif} .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
    .sheen{animation:sh 6s ease-in-out infinite}
    @keyframes sh{0%{transform:translateX(-260px) skewX(-20deg)}40%,100%{transform:translateX(640px) skewX(-20deg)}}
    .ping{transform-box:fill-box;transform-origin:center;animation:ping 1.8s cubic-bezier(0,0,.2,1) infinite}
    @keyframes ping{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.6);opacity:0}}
    .ic{transform-box:fill-box;transform-origin:center;animation:bob 3.4s ease-in-out infinite}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.sheen{opacity:0}}
  </style>
  <g clip-path="url(#c)">
    <rect width="560" height="206" fill="url(#bg)"/>
    <rect width="560" height="206" fill="url(#glow)"/>
    <rect class="sheen" x="0" y="0" width="160" height="206" fill="url(#sheen)"/>
  </g>
  <rect x=".75" y=".75" width="558.5" height="204.5" rx="19.25" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
  <rect x="28" y="26" width="52" height="52" rx="14" fill="#A78BFA" fill-opacity=".14" stroke="#A78BFA" stroke-opacity=".4"/>
  <g class="ic"><g transform="translate(40 38) scale(1.17)" fill="none" stroke="#A78BFA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/><path d="M12 22V12"/><path d="m3.3 7 7.703 4.734a2 2 0 0 0 1.994 0L20.7 7"/><path d="m7.5 4.27 9 5.15"/></g></g>
  <text x="96" y="50" font-size="22" font-weight="700" fill="#F8FAFC" letter-spacing="-.3">ByteShelf</text>
  <text x="96" y="72" class="m" font-size="11.5" fill="#A78BFA" letter-spacing="1.1">PERSONAL · 2026</text>
  <g>
    <rect x="468" y="30" width="64" height="26" rx="13" fill="#22C55E" fill-opacity=".1" stroke="#22C55E" stroke-opacity=".35"/>
    <circle class="ping" cx="484" cy="43" r="4" fill="#22C55E"/><circle cx="484" cy="43" r="4" fill="#22C55E"/>
    <text x="494" y="47.5" font-size="12" font-weight="600" fill="#86EFAC">Live</text>
  </g>
  <text x="28" y="114" font-size="16" fill="#94A3B8">Download hub for my free apps on macOS,</text><text x="28" y="137" font-size="16" fill="#94A3B8">Windows, Linux, Android &amp; iOS.</text>
  <rect x="28" y="154" width="74" height="28" rx="8" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".1"/><text x="64.9" y="172.5" text-anchor="middle" class="m" font-size="12.5" fill="#CBD5E1">Next.js</text><rect x="109.80000000000001" y="154" width="96" height="28" rx="8" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".1"/><text x="157.8" y="172.5" text-anchor="middle" class="m" font-size="12.5" fill="#CBD5E1">TypeScript</text><rect x="213.8" y="154" width="81" height="28" rx="8" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".1"/><text x="254.4" y="172.5" text-anchor="middle" class="m" font-size="12.5" fill="#CBD5E1">Tailwind</text><rect x="303.0" y="154" width="89" height="28" rx="8" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".1"/><text x="347.3" y="172.5" text-anchor="middle" class="m" font-size="12.5" fill="#CBD5E1">shadcn/ui</text>
</svg>
