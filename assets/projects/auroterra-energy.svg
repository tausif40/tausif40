<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 206" width="560" height="206" role="img" aria-label="Auroterra Energy">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1020"/><stop offset="1" stop-color="#0D1117"/></linearGradient>
    <radialGradient id="glow" cx="1" cy="0" r="1"><stop offset="0" stop-color="#60A5FA" stop-opacity=".28"/><stop offset=".6" stop-color="#60A5FA" stop-opacity="0"/></radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#60A5FA" stop-opacity=".6"/><stop offset=".45" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity=".05"/></linearGradient>
    <linearGradient id="sheen" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".06"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <clipPath id="c"><rect width="560" height="206" rx="20"/></clipPath>
  </defs>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif} .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
    .sheen{animation:sh 6s ease-in-out infinite}
    @keyframes sh{0%{transform:translateX(-260px) skewX(-20deg)}40%,100%{transform:translateX(640px) skewX(-20deg)}}
    .ping{transform-box:fill-box;transform-origin:center;animation:ping 1.8s cubic-bezier(0,0,.2,1) infinite}
    @keyframes ping{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.6);opacity:0}}
    .ic{transform-box:fill-box;transform-origin:center;animation:bob 3.4s ease-in-out infinite}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.sheen{opacity:0}}
  </style>
  <g clip-path="url(#c)">
    <rect width="560" height="206" fill="url(#bg)"/>
    <rect width="560" height="206" fill="url(#glow)"/>
    <rect class="sheen" x="0" y="0" width="160" height="206" fill="url(#sheen)"/>
  </g>
  <rect x=".75" y=".75" width="558.5" height="204.5" rx="19.25" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
  <rect x="28" y="26" width="52" height="52" rx="14" fill="#60A5FA" fill-opacity=".14" stroke="#60A5FA" stroke-opacity=".4"/>
  <g class="ic"><g transform="translate(40 38) scale(1.17)" fill="none" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8l-7 5V8l-7 5V4a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/><path d="M17 18h1M12 18h1M7 18h1"/></g></g>
  <text x="96" y="50" font-size="22" font-weight="700" fill="#F8FAFC" letter-spacing="-.3">Auroterra Energy</text>
  <text x="96" y="72" class="m" font-size="11.5" fill="#60A5FA" letter-spacing="1.1">CLIENT · 2024</text>
  <g>
    <rect x="468" y="30" width="64" height="26" rx="13" fill="#22C55E" fill-opacity=".1" stroke="#22C55E" stroke-opacity=".35"/>
    <circle class="ping" cx="484" cy="43" r="4" fill="#22C55E"/><circle cx="484" cy="43" r="4" fill="#22C55E"/>
    <text x="494" y="47.5" font-size="12" font-weight="600" fill="#86EFAC">Live</text>
  </g>
  <text x="28" y="114" font-size="16" fill="#94A3B8">Product catalogue for a polymer supplier:</text><text x="28" y="137" font-size="16" fill="#94A3B8">9 grades, one-tap WhatsApp quotes.</text>
  <rect x="28" y="154" width="59" height="28" rx="8" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".1"/><text x="57.5" y="172.5" text-anchor="middle" class="m" font-size="12.5" fill="#CBD5E1">React</text><rect x="95.0" y="154" width="81" height="28" rx="8" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".1"/><text x="135.6" y="172.5" text-anchor="middle" class="m" font-size="12.5" fill="#CBD5E1">Tailwind</text><rect x="184.2" y="154" width="96" height="28" rx="8" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".1"/><text x="232.2" y="172.5" text-anchor="middle" class="m" font-size="12.5" fill="#CBD5E1">JavaScript</text>
</svg>
