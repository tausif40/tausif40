  <text class="sans" x="78" y="51" font-size="32" font-weight="700" fill="#F8F4EE">AnyUni</text>
  <circle cx="550" cy="39" r="18" fill="#26334B"/>
  <path class="nudge" d="M544 45L556 33M544 33H556V45" stroke="#B7AEFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M31 68H569" stroke="#34415B"/>
  <rect x="31" y="80" width="126" height="94" rx="15" fill="#31314D"/>
  <g class="float" style="animation-delay:-04s" stroke="none">
    <path d="M49 114L91 93L133 114L91 135Z" stroke="#B7AEFF" stroke-width="3" stroke-linejoin="round"/>
    <path d="M62 123V142Q91 160 120 142V123M133 114V143" stroke="#B7AEFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="133" cy="148" r="3" fill="#B7AEFF"/>
 </g>
  <text class="sans" x="177" y="114" font-size="22" font-weight="700" fill="#F8F4EE">Discover UK courses.</text>
