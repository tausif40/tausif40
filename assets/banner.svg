<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Tausif — Full Stack Developer</title>
  <desc id="desc">Web, mobile and AI. Based in Indore, India with over five years of experience.</desc>
  <style>
  .sans{font-family:Arial,Helvetica,sans-serif}.mono{font-family:Menlo,Consolas,'Liberation Mono',monospace}
  .float{animation:float 5s ease-in-out infinite}.pulse{animation:pulse 2.8s ease-in-out infinite}
  .drift{animation:drift 18s linear infinite;transform-origin:center}.scan{animation:scan 3s ease-in-out infinite}
  .nudge{animation:nudge 2.5s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.38}}
  @keyframes drift{to{transform:rotate(360deg)}}
  @keyframes scan{0%,100%{transform:translateY(0);opacity:.45}50%{transform:translateY(35px);opacity:1}}
  @keyframes nudge{0%,100%{transform:translate(0,0)}50%{transform:translate(4px,-4px)}}
  @media(prefers-reduced-motion:reduce){.float,.pulse,.drift,.scan,.nudge{animation:none!important}}
</style>
  
  <defs>
    <clipPath id="round"><rect width="1200" height="400" rx="24"/></clipPath>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#6DD8CD" fill-opacity=".13"/></pattern>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FF796B" stop-opacity=".17"/><stop offset="1" stop-color="#6DD8CD" stop-opacity=".05"/></linearGradient>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1200" height="400" fill="#0E1423"/>
    <rect x="640" width="560" height="400" fill="url(#dots)"/>
    <circle cx="990" cy="205" r="200" fill="url(#glow)"/>
    <circle class="drift" cx="978" cy="211" r="167" stroke="#6DD8CD" stroke-opacity=".19" stroke-dasharray="5 13"/>
    <circle cx="978" cy="211" r="135" stroke="#FF796B" stroke-opacity=".16"/>
    <rect x="42" y="30" width="44" height="44" rx="13" fill="#FF796B"/>
    <text class="sans" x="64" y="59" text-anchor="middle" font-size="25" font-weight="700" fill="#0E1423">T.</text>
    <text class="mono" x="103" y="58" font-size="14" letter-spacing="2" fill="#F8F4EE">TAUSIF / DEV</text>
    <circle class="pulse" cx="962" cy="52" r="5" fill="#6DD8CD"/>
    <text class="mono" x="977" y="57" font-size="13" fill="#B8C2D4">OPEN TO OPPORTUNITIES</text>
    <path d="M42 92H1158" stroke="#34415B"/>
    <text class="mono" x="48" y="139" font-size="14" letter-spacing="2" fill="#6DD8CD">FULL STACK DEVELOPER</text>
    <text class="sans" x="42" y="227" font-size="94" font-weight="700" letter-spacing="-5" fill="#F8F4EE">Tausif<tspan fill="#FF796B">.</tspan></text>
    <text class="sans" x="48" y="281" font-size="34" font-weight="600" fill="#F8F4EE">Web. Mobile. AI.</text>
    <text class="mono" x="49" y="334" font-size="16" fill="#B8C2D4">5+ YEARS <tspan fill="#FF796B">/</tspan> INDORE, INDIA <tspan fill="#FF796B">/</tspan> REMOTE</text>
    <g class="float">
      <rect x="757" y="119" width="354" height="189" rx="17" fill="#182238" stroke="#485A75"/>
      <path d="M757 157H1111" stroke="#34415B"/>
      <circle cx="778" cy="139" r="4" fill="#FF796B"/><circle cx="793" cy="139" r="4" fill="#F4C67D"/><circle cx="808" cy="139" r="4" fill="#6DD8CD"/>
      <text class="mono" x="833" y="144" font-size="13" fill="#B8C2D4">build.tsx</text>
      <text class="mono" x="779" y="197" font-size="20" fill="#FF796B">&lt;idea</text>
      <text class="mono" x="807" y="230" font-size="20" fill="#F8F4EE">madeWith="care"</text>
      <text class="mono" x="779" y="267" font-size="20" fill="#6DD8CD">/&gt;</text>
    </g>
    <g class="float" style="animation-delay:-1.5s">
      <rect x="836" y="290" width="285" height="68" rx="15" fill="#FF796B"/>
      <circle cx="869" cy="324" r="17" fill="#0E1423"/>
      <path d="M862 330L875 317M863 317H875V329" stroke="#F8F4EE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text class="mono" x="900" y="321" font-size="14" font-weight="700" fill="#0E1423">FROM IDEA TO LAUNCH</text>
      <text class="mono" x="900" y="342" font-size="11" fill="#3E2835">DESIGN · BUILD · SHIP</text>
    </g>
    <text class="mono" x="1158" y="385" text-anchor="end" font-size="12" letter-spacing="1.3" fill="#8B9AAF">CRAFTED WITH INTENT  ✦</text>
  </g>
  <rect x=".5" y=".5" width="1199" height="399" rx="23.5" stroke="#34415B"/>

</svg>
