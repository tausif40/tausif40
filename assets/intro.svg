<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="t d">
  <title id="t">In short: I turn ideas into products people love to use</title>
  <desc id="d">Full stack developer with 5+ years of experience and 10+ projects shipped. Product mindset, front end to back end, AI features that ship, clean scalable code, clear communication, fast and steady delivery.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B0F17"/><stop offset="1" stop-color="#0D1117"/></linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#fff" fill-opacity=".06"/></pattern>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(120 70) scale(360 300)"><stop stop-color="#7C3AED" stop-opacity=".22"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/></radialGradient>
    <linearGradient id="hl" x1="0" x2="1"><stop stop-color="#C4B5FD"/><stop offset="1" stop-color="#F0ABFC"/></linearGradient>
    <clipPath id="panel"><rect x="40" y="40" width="380" height="340" rx="18"/></clipPath>
  </defs>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif} .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
    .rise{animation:rise .8s cubic-bezier(.2,.8,.2,1) backwards}
    @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    .d1{animation-delay:.05s} .d2{animation-delay:.12s} .d3{animation-delay:.2s}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <rect x=".5" y=".5" width="1199" height="419" rx="20" fill="url(#bg)" stroke="#fff" stroke-opacity=".09"/>
  <g clip-path="url(#panel)">
    <rect x="40" y="40" width="380" height="340" fill="#7C3AED" fill-opacity=".06"/>
    <rect x="40" y="40" width="380" height="340" fill="url(#dots)"/>
    <rect x="40" y="40" width="380" height="340" fill="url(#glow)"/>
  </g>
  <rect x="40.5" y="40.5" width="379" height="339" rx="17.5" fill="none" stroke="#A78BFA" stroke-opacity=".22"/>
  <g class="rise d1">
    <rect x="64" y="72" width="22" height="2" rx="1" fill="#A78BFA"/>
    <text x="96" y="78" class="m" font-size="12" font-weight="600" fill="#A78BFA" letter-spacing="2.4">IN SHORT</text>
  </g>
  <g class="rise d2" font-size="30" font-weight="700" fill="#F8FAFC" letter-spacing="-.6">
    <text x="64" y="132">I turn ideas into</text>
    <text x="64" y="170">products people</text>
    <text x="64" y="208"><tspan fill="url(#hl)">love to use.</tspan></text>
  </g>
  <g class="rise d3">
    <text x="64" y="250" font-size="15" fill="#94A3B8">Full stack developer building for</text>
    <text x="64" y="272" font-size="15" fill="#94A3B8">startups, businesses &amp; their users.</text>
    <path d="M64 300.5h332" stroke="#fff" stroke-opacity=".08"/>
    <text x="64" y="342" font-size="28" font-weight="800" fill="#F8FAFC">5+</text>
    <text x="64" y="362" font-size="12.5" fill="#64748B">Years building</text>
    <path d="M190.5 318v46" stroke="#fff" stroke-opacity=".08"/>
    <text x="214" y="342" font-size="28" font-weight="800" fill="#F8FAFC">10+</text>
    <text x="214" y="362" font-size="12.5" fill="#64748B">Projects shipped</text>
  </g>
  <g class="rise" style="animation-delay:0.25s">
    <rect x="460.5" y="40.5" width="341" height="101" rx="14" fill="#fff" fill-opacity=".025" stroke="#fff" stroke-opacity=".08"/>
    <rect x="480" y="71" width="40" height="40" rx="11" fill="#A78BFA" fill-opacity=".1" stroke="#A78BFA" stroke-opacity=".3"/>
    <g transform="translate(490 81) scale(0.833)" fill="none" stroke="#A78BFA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></g>
    <text x="536" y="87" font-size="16" font-weight="600" fill="#E2E8F0">Product mindset</text>
    <text x="536" y="110" font-size="13.5" fill="#94A3B8">I build for users, not just specs</text>
  </g><g class="rise" style="animation-delay:0.33s">
    <rect x="818.5" y="40.5" width="341" height="101" rx="14" fill="#fff" fill-opacity=".025" stroke="#fff" stroke-opacity=".08"/>
    <rect x="838" y="71" width="40" height="40" rx="11" fill="#22D3EE" fill-opacity=".1" stroke="#22D3EE" stroke-opacity=".3"/>
    <g transform="translate(848 81) scale(0.833)" fill="none" stroke="#22D3EE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/></g>
    <text x="894" y="87" font-size="16" font-weight="600" fill="#E2E8F0">Front end to back end</text>
    <text x="894" y="110" font-size="13.5" fill="#94A3B8">UI, APIs, database &amp; deployment</text>
  </g><g class="rise" style="animation-delay:0.41s">
    <rect x="460.5" y="159.5" width="341" height="101" rx="14" fill="#fff" fill-opacity=".025" stroke="#fff" stroke-opacity=".08"/>
    <rect x="480" y="190" width="40" height="40" rx="11" fill="#F0ABFC" fill-opacity=".1" stroke="#F0ABFC" stroke-opacity=".3"/>
    <g transform="translate(490 200) scale(0.833)" fill="none" stroke="#F0ABFC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/><path d="M20 3v4M22 5h-4"/></g>
    <text x="536" y="206" font-size="16" font-weight="600" fill="#E2E8F0">AI that ships</text>
    <text x="536" y="229" font-size="13.5" fill="#94A3B8">Claude &amp; OpenAI in real products</text>
  </g><g class="rise" style="animation-delay:0.49s">
    <rect x="818.5" y="159.5" width="341" height="101" rx="14" fill="#fff" fill-opacity=".025" stroke="#fff" stroke-opacity=".08"/>
    <rect x="838" y="190" width="40" height="40" rx="11" fill="#34D399" fill-opacity=".1" stroke="#34D399" stroke-opacity=".3"/>
    <g transform="translate(848 200) scale(0.833)" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/></g>
    <text x="894" y="206" font-size="16" font-weight="600" fill="#E2E8F0">Clean, scalable code</text>
    <text x="894" y="229" font-size="13.5" fill="#94A3B8">Typed, tested &amp; easy to hand over</text>
  </g><g class="rise" style="animation-delay:0.57s">
    <rect x="460.5" y="278.5" width="341" height="101" rx="14" fill="#fff" fill-opacity=".025" stroke="#fff" stroke-opacity=".08"/>
    <rect x="480" y="309" width="40" height="40" rx="11" fill="#60A5FA" fill-opacity=".1" stroke="#60A5FA" stroke-opacity=".3"/>
    <g transform="translate(490 319) scale(0.833)" fill="none" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></g>
    <text x="536" y="325" font-size="16" font-weight="600" fill="#E2E8F0">Clear communication</text>
    <text x="536" y="348" font-size="13.5" fill="#94A3B8">Regular updates, no surprises</text>
  </g><g class="rise" style="animation-delay:0.65s">
    <rect x="818.5" y="278.5" width="341" height="101" rx="14" fill="#fff" fill-opacity=".025" stroke="#fff" stroke-opacity=".08"/>
    <rect x="838" y="309" width="40" height="40" rx="11" fill="#FBBF24" fill-opacity=".1" stroke="#FBBF24" stroke-opacity=".3"/>
    <g transform="translate(848 319) scale(0.833)" fill="none" stroke="#FBBF24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/></g>
    <text x="894" y="325" font-size="16" font-weight="600" fill="#E2E8F0">Fast, steady delivery</text>
    <text x="894" y="348" font-size="13.5" fill="#94A3B8">Small releases, quick feedback</text>
  </g>
