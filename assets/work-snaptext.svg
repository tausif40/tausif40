<svg xmlns="http://www.w3.org/2000/svg" width="600" height="205" viewBox="0 0 600 205" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">SnapText</title>
  <desc id="desc">Copy text from any screen. Swift · AppKit · Vision OCR</desc>
  <style>
  .sans{font-family:Arial,Helvetica,sans-serif}.mono{font-family:Menlo,Consolas,'Liberation Mono',monospace}
  .float{animation:float 5s ease-in-out infinite}.pulse{animation:pulse 2.8s ease-in-out infinite}
  .drift{animation:drift 18s linear infinite;transform-origin:center}.scan{animation:scan 3s ease-in-out infinite}
  .nudge{animation:nudge 2.5s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.38}}
  @keyframes drift{to{transform:rotate(360deg)}}
  @keyframes scan{0%,100%{transform:translateY(0);opacity:.45}50%{transform:translateY(35px);opacity:1}}
  @keyframes nudge{0%,100%{transform:translate(0,0)}50%{transform:translate(4px,-4px)}}
  @media(prefers-reduced-motion:reduce){.float,.pulse,.drift,.scan,.nudge{animation:none!important}}
</style>
  
  <rect x=".5" y=".5" width="599" height="204" rx="20" fill="#182238" stroke="#34415B"/>
  <rect x="1" y="1" width="5" height="203" rx="2" fill="#6DD8CD"/>
  <circle cx="48" cy="39" r="17" fill="#1C3945"/>
  <text class="mono" x="48" y="44" text-anchor="middle" font-size="14" font-weight="700" fill="#6DD8CD">02</text>
  <text class="sans" x="78" y="51" font-size="32" font-weight="700" fill="#F8F4EE">SnapText</text>
  <circle cx="550" cy="39" r="18" fill="#26334B"/>
  <path class="nudge" d="M544 45L556 33M544 33H556V45" stroke="#6DD8CD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M31 68H569" stroke="#34415B"/>
  <rect x="31" y="80" width="126" height="94" rx="15" fill="#1C3945"/>
  <g class="float" style="animation-delay:-02s" stroke="none">
    <path d="M49 111V95H64M120 95H134V111M49 142V157H64M120 157H134V142" stroke="#6DD8CD" stroke-width="3" stroke-linecap="round"/>
    <text class="sans" x="65" y="140" font-size="39" font-weight="700" fill="#6DD8CD">Aa</text>
    <path class="scan" d="M53 109H130" stroke="#6DD8CD" stroke-width="2"/>
 </g>
  <text class="sans" x="177" y="114" font-size="22" font-weight="700" fill="#F8F4EE">Copy text from any screen.</text>
  <text class="sans" x="177" y="144" font-size="17" fill="#B8C2D4">Swift · AppKit · Vision OCR</text>
  <text class="mono" x="177" y="173" font-size="13" letter-spacing="1.1" fill="#6DD8CD">OPEN SOURCE · EXPLORE ↗</text>

</svg>
