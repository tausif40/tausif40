  <text x="96" y="50" font-size="22" font-weight="700" fill="#F8FAFC" letter-spacing="-.3">Zappy Eventz</text>
  <text x="96" y="72" class="m" font-size="11.5" fill="#F472B6" letter-spacing="1.1">CLIENT · 2025</text>
  <g>
    <rect x="468" y="30" width="64" height="26" rx="13" fill="#22C55E" fill-opacity=".1" stroke="#22C55E" stroke-opacity=".35"/>
    <circle class="ping" cx="484" cy="43" r="4" fill="#22C55E"/><circle cx="484" cy="43" r="4" fill="#22C55E"/>
    <text x="494" y="47.5" font-size="12" font-weight="600" fill="#86EFAC">Live</text>
  </g>
  <text x="28" y="114" font-size="16" fill="#94A3B8">Event booking platform live in 4 cities,</text><text x="28" y="137" font-size="16" fill="#94A3B8">100+ services, multi-service cart &amp; payments.</text>
