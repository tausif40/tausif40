<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 592 76" width="592" height="76" role="img" aria-label="View SnapText source code on GitHub">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B0F17"/><stop offset="1" stop-color="#0D1117"/></linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#fff" fill-opacity=".06"/></pattern>
    <linearGradient id="sheen" x1="0" x2="1"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <clipPath id="clip"><rect width="592" height="76" rx="16"/></clipPath>
  </defs>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif} .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
    .rise{animation:rise .8s cubic-bezier(.2,.8,.2,1) backwards}
    @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    .sheen{animation:sheen 5s ease-in-out 1.2s infinite}
    @keyframes sheen{0%{transform:translateX(0)}35%,100%{transform:translateX(792px)}}
    .nudge{animation:nudge 2.4s ease-in-out infinite}
    @keyframes nudge{0%,100%{transform:translate(0,0)}50%{transform:translate(2px,-2px)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
