<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-labelledby="t d">
  <title id="t">SnapText — copy text from anywhere on your Mac's screen</title>
  <desc id="d">macOS menu bar app. Option-X copies text from anything on screen; Option-V opens a searchable clipboard history. On-device OCR in 28 languages, under 1 MB, no account and no tracking. Built with Swift 6.2, AppKit and Apple Vision.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B0F17"/><stop offset="1" stop-color="#0D1117"/></linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#fff" fill-opacity=".06"/></pattern>
    <radialGradient id="glow" cx=".8" cy=".2" r=".6"><stop offset="0" stop-color="#22D3EE" stop-opacity=".14"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
    <linearGradient id="app" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#2563EB"/></linearGradient>
    <linearGradient id="photo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1E293B"/><stop offset="1" stop-color="#0F172A"/></linearGradient>
    <clipPath id="frame"><rect width="1200" height="440" rx="24"/></clipPath>
    <clipPath id="win"><rect x="640" y="40" width="520" height="360" rx="14"/></clipPath>
  </defs>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif} .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
    .rise{animation:rise .7s cubic-bezier(.2,.8,.2,1) backwards}
    @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    .sel{transform-box:fill-box;transform-origin:0 0;animation:sel 6s cubic-bezier(.4,0,.2,1) infinite}
    @keyframes sel{0%,8%{transform:scale(0);opacity:1}28%,70%{transform:scale(1);opacity:1}80%,100%{transform:scale(1);opacity:0}}
    .toast{animation:toast 6s ease infinite}
    @keyframes toast{0%,30%{opacity:0;transform:translateY(8px)}36%,68%{opacity:1;transform:none}76%,100%{opacity:0;transform:translateY(-6px)}}
    .menu{animation:menu 6s ease infinite}
    @keyframes menu{0%,40%{opacity:.35}48%,92%{opacity:1}100%{opacity:.35}}
    .hl{animation:hl 6s ease infinite}
    @keyframes hl{0%,44%{opacity:0}52%,92%{opacity:1}100%{opacity:0}}
    .cur{animation:cur 6s cubic-bezier(.4,0,.2,1) infinite}
    @keyframes cur{0%,8%{transform:translate(0,0)}28%,100%{transform:translate(206px,92px)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="440" fill="url(#bg)"/>
    <rect width="1200" height="440" fill="url(#glow)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="439" rx="23.5" fill="none" stroke="#fff" stroke-opacity=".09"/>

  <!-- left: copy -->
  <g class="rise">
    <rect x="56" y="48" width="64" height="64" rx="16" fill="url(#app)"/>
    <rect x="56.5" y="48.5" width="63" height="63" rx="15.5" fill="none" stroke="#fff" stroke-opacity=".25"/>
    <g transform="translate(72 64) scale(1.33)" fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 8h8M7 12h10M7 16h6"/></g>
    <text x="138" y="80" font-size="34" font-weight="800" fill="#F8FAFC" letter-spacing="-.8">SnapText</text>
    <rect x="300" y="58" width="44" height="24" rx="12" fill="#22D3EE" fill-opacity=".12" stroke="#22D3EE" stroke-opacity=".4"/>
    <text x="322" y="74.5" text-anchor="middle" class="m" font-size="11.5" font-weight="700" fill="#22D3EE">v2.1</text>
    <text x="139" y="104" class="m" font-size="12" fill="#64748B" letter-spacing="1.2">MACOS MENU BAR APP · OPEN SOURCE</text>
  </g>
  <text class="rise" style="animation-delay:.2s" x="56" y="172" font-size="22" font-weight="600" fill="#E2E8F0" letter-spacing="-.3">Copy text from anywhere on your Mac's screen.</text>
  <g class="rise" style="animation-delay:0.35s"><rect x="56" y="222" width="26" height="24" rx="6" fill="#1E293B" stroke="#fff" stroke-opacity=".14"/><rect x="56" y="242" width="26" height="4" rx="2" fill="#000" fill-opacity=".25"/><text x="69" y="238.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#E2E8F0">⌥</text><rect x="86" y="222" width="26" height="24" rx="6" fill="#1E293B" stroke="#fff" stroke-opacity=".14"/><rect x="86" y="242" width="26" height="4" rx="2" fill="#000" fill-opacity=".25"/><text x="99" y="238.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#E2E8F0">X</text><text x="128" y="239" font-size="15" fill="#CBD5E1">Copy text from images, videos, PDFs &amp; dialogs</text></g><g class="rise" style="animation-delay:0.45s"><rect x="56" y="262" width="26" height="24" rx="6" fill="#1E293B" stroke="#fff" stroke-opacity=".14"/><rect x="56" y="282" width="26" height="4" rx="2" fill="#000" fill-opacity=".25"/><text x="69" y="278.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#E2E8F0">⌥</text><rect x="86" y="262" width="26" height="24" rx="6" fill="#1E293B" stroke="#fff" stroke-opacity=".14"/><rect x="86" y="282" width="26" height="4" rx="2" fill="#000" fill-opacity=".25"/><text x="99" y="278.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#E2E8F0">V</text><text x="128" y="279" font-size="15" fill="#CBD5E1">Search &amp; paste your clipboard history (1,000 items)</text></g><g class="rise" style="animation-delay:0.55s"><g transform="translate(74 304) scale(0.8)" fill="none" stroke="#22D3EE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 8 6 6M4 14l6-6 2-3M2 5h12M7 2h1M22 22l-5-10-5 10M14 18h6"/></g><text x="128" y="319" font-size="15" fill="#CBD5E1">On-device OCR in 28 languages</text></g><g class="rise" style="animation-delay:0.65s"><g transform="translate(74 344) scale(0.8)" fill="none" stroke="#22D3EE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></g><text x="128" y="359" font-size="15" fill="#CBD5E1">Under 1 MB · no account · no tracking</text></g>
  <g class="rise" style="animation-delay:.8s"><rect x="56" y="384" width="89" height="28" rx="8" fill="#fff" fill-opacity=".04" stroke="#fff" stroke-opacity=".1"/><text x="100.3" y="402.5" text-anchor="middle" class="m" font-size="12.5" fill="#94A3B8">Swift 6.2</text><rect x="152.60000000000002" y="384" width="66" height="28" rx="8" fill="#fff" fill-opacity=".04" stroke="#fff" stroke-opacity=".1"/><text x="185.8" y="402.5" text-anchor="middle" class="m" font-size="12.5" fill="#94A3B8">AppKit</text><rect x="227.00000000000003" y="384" width="111" height="28" rx="8" fill="#fff" fill-opacity=".04" stroke="#fff" stroke-opacity=".1"/><text x="282.4" y="402.5" text-anchor="middle" class="m" font-size="12.5" fill="#94A3B8">Apple Vision</text><rect x="345.80000000000007" y="384" width="148" height="28" rx="8" fill="#fff" fill-opacity=".04" stroke="#fff" stroke-opacity=".1"/><text x="419.7" y="402.5" text-anchor="middle" class="m" font-size="12.5" fill="#94A3B8">Accessibility API</text></g>

  <!-- right: product mock -->
  <g class="rise" style="animation-delay:.25s">
    <rect x="640" y="40" width="520" height="360" rx="14" fill="#0F172A"/>
    <g clip-path="url(#win)">
      <rect x="640" y="40" width="520" height="30" fill="#fff" fill-opacity=".05"/>
      <path transform="translate(656 48) scale(.583)" d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701" fill="#E2E8F0"/>
      <text x="682" y="60" font-size="12" font-weight="700" fill="#E2E8F0">Preview</text>
      <text x="742" y="60" font-size="12" fill="#94A3B8">File   Edit   View</text>
      <g class="menu"><rect x="1012" y="45" width="26" height="20" rx="5" fill="#22D3EE" fill-opacity=".22"/>
      <g transform="translate(1017 47.5) scale(0.62)" fill="none" stroke="#22D3EE" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 8h8M7 12h10M7 16h6"/></g></g>
      <rect x="1052" y="51" width="18" height="9" rx="2.5" fill="none" stroke="#94A3B8"/><rect x="1054" y="53" width="11" height="5" rx="1" fill="#94A3B8"/>
      <text x="1146" y="60" text-anchor="end" font-size="12" font-weight="600" fill="#E2E8F0">9:41</text>

      <!-- document / screenshot being captured -->
      <rect x="664" y="96" width="248" height="280" rx="10" fill="url(#photo)" stroke="#fff" stroke-opacity=".07"/>
      <rect x="684" y="116" width="96" height="10" rx="5" fill="#334155"/>
      <text x="684" y="160" font-size="15" font-weight="700" fill="#E2E8F0">Revenue Q3</text>
      <text x="684" y="188" font-size="22" font-weight="800" fill="#F8FAFC">$48,920</text>
      <text x="684" y="212" font-size="13" fill="#4ADE80">+18.4% vs last quarter</text>
      <g fill="#1E293B">
        <rect x="684" y="250" width="16" height="96" rx="3"/><rect x="708" y="282" width="16" height="64" rx="3"/>
        <rect x="732" y="266" width="16" height="80" rx="3"/><rect x="756" y="236" width="16" height="110" rx="3"/>
        <rect x="780" y="294" width="16" height="52" rx="3"/><rect x="804" y="258" width="16" height="88" rx="3" fill="#164E63"/>
        <rect x="828" y="244" width="16" height="102" rx="3" fill="#0E7490"/><rect x="852" y="228" width="16" height="118" rx="3" fill="#22D3EE"/>
      </g>
      <g class="sel"><rect x="676" y="140" width="208" height="84" rx="4" fill="#22D3EE" fill-opacity=".10" stroke="#22D3EE" stroke-width="1.5" stroke-dasharray="5 4"/></g>
      <g class="cur"><path transform="translate(668 132)" d="M0 0 L0 15 L4 11 L7 18 L9.5 17 L6.5 10 L12 10 Z" fill="#fff" stroke="#0F172A" stroke-width="1"/></g>
      <g class="toast">
        <rect x="688" y="320" width="200" height="36" rx="10" fill="#0B1220" stroke="#22D3EE" stroke-opacity=".5"/>
        <circle cx="708" cy="338" r="9" fill="#22D3EE" fill-opacity=".18"/>
        <g transform="translate(702 332) scale(0.5)" fill="none" stroke="#22D3EE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></g>
        <text x="726" y="342.5" font-size="12.5" font-weight="600" fill="#E0F2FE">Copied 3 lines</text>
      </g>

      <!-- clipboard history dropdown -->
      <g class="menu">
        <rect x="900" y="80" width="248" height="300" rx="12" fill="#111827" stroke="#fff" stroke-opacity=".12"/>
        <text x="916" y="106" font-size="12.5" font-weight="700" fill="#E2E8F0">Clipboard History</text>
        <rect x="1104" y="92" width="34" height="20" rx="5" fill="#1E293B" stroke="#fff" stroke-opacity=".12"/>
        <text x="1121" y="106" text-anchor="middle" font-size="11" font-weight="600" fill="#CBD5E1">⌥V</text>
        <rect x="912" y="120" width="224" height="26" rx="7" fill="#0B1220" stroke="#fff" stroke-opacity=".08"/>
        <g transform="translate(921 127) scale(0.5)" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></g>
        <text x="938" y="137" font-size="11.5" fill="#64748B">Search copies…</text>
        <rect class="hl" x="912" y="150" width="224" height="34" rx="8" fill="#22D3EE" fill-opacity=".12" stroke="#22D3EE" stroke-opacity=".35"/><text x="924" y="172" class="m" font-size="11.5" fill="#E0F2FE">Revenue Q3 · $48,920</text><text x="1124" y="172" text-anchor="end" class="m" font-size="9.5" font-weight="700" fill="#22D3EE">OCR</text><text x="924" y="212" class="m" font-size="11.5" fill="#94A3B8">git checkout -b feature/ocr</text><text x="924" y="252" class="m" font-size="11.5" fill="#94A3B8">Meeting moved to 4:30 PM</text><text x="924" y="292" class="m" font-size="11.5" fill="#94A3B8">hello@company.com</text>
        <text x="916" y="364" class="m" font-size="10" fill="#475569">1,000 items · stored on this Mac</text>
      </g>
    </g>
    <rect x="640.5" y="40.5" width="519" height="359" rx="13.5" fill="none" stroke="#fff" stroke-opacity=".12"/>
  </g>
</svg>
