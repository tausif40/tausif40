<svg xmlns="http://www.w3.org/2000/svg" width="600" height="255" viewBox="0 0 600 255" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Let us build something great</title>
  <desc id="desc">Email Tausif at tausif6040@gmail.com for projects and opportunities.</desc>
  <style>
  .sans{font-family:Arial,Helvetica,sans-serif}.mono{font-family:Menlo,Consolas,'Liberation Mono',monospace}
  .float{animation:float 5s ease-in-out infinite}.pulse{animation:pulse 2.8s ease-in-out infinite}
  .drift{animation:drift 18s linear infinite;transform-origin:center}.scan{animation:scan 3s ease-in-out infinite}
  .nudge{animation:nudge 2.5s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.38}}
  @keyframes drift{to{transform:rotate(360deg)}}
  @keyframes scan{0%,100%{transform:translateY(0);opacity:.45}50%{transform:translateY(35px);opacity:1}}
  @keyframes nudge{0%,100%{transform:translate(0,0)}50%{transform:translate(4px,-4px)}}
  @media(prefers-reduced-motion:reduce){.float,.pulse,.drift,.scan,.nudge{animation:none!important}}
</style>
  
  <rect x=".5" y=".5" width="599" height="254" rx="22" fill="#FF796B" stroke="#D45B5D"/>
  <text class="mono" x="28" y="39" font-size="15" letter-spacing="1" fill="#593343">OPEN TO OPPORTUNITIES</text>
  <text class="sans" x="26" y="105" font-size="56" font-weight="700" letter-spacing="-2" fill="#0E1423">Let's build</text>
  <text class="sans" x="26" y="164" font-size="56" font-weight="700" letter-spacing="-2" fill="#0E1423">something great.</text>
  <text class="mono" x="29" y="218" font-size="21" fill="#482C3D">tausif6040@gmail.com</text>
  <circle cx="525" cy="210" r="32" fill="#0E1423"/>
  <path class="nudge" d="M514 221L536 199M514 199H536V221" stroke="#F8F4EE" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

</svg>
