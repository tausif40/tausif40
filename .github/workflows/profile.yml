name: Update profile visuals

on:
  schedule:
    - cron: "30 0 * * *" # daily at 00:30 UTC (06:00 IST)
  workflow_dispatch: # run manually from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: profile-visuals
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Both images live in the repo (assets/) so the README always has
      # something to show, even before the first scheduled run.
      - name: Generate activity card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/activity_card.py "${{ github.repository_owner }}" assets/activity.svg

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#C084FC&color_dots=#161B22,#2E1065,#5B21B6,#8B5CF6,#C4B5FD
            dist/snake-light.svg?palette=github-light&color_snake=#7C3AED&color_dots=#EBEDF0,#DDD6FE,#A78BFA,#7C3AED,#4C1D95

      # Merge both palettes into one file that follows the viewer's GitHub theme.
      - name: Build theme-aware snake
        run: python3 .github/scripts/merge_snake.py dist/snake-light.svg dist/snake-dark.svg assets/snake.svg

      - name: Commit updated images
        run: |
          if git diff --quiet -- assets/activity.svg assets/snake.svg; then
            echo "Images unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity.svg assets/snake.svg
          git commit -m "chore: refresh profile images"
          git push
