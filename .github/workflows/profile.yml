name: Update profile visuals

on:
  schedule:
    - cron: "30 0 * * *" # daily at 00:30 UTC (06:00 IST)
  workflow_dispatch: # run manually from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: profile-visuals
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Activity card lives in the repo (assets/activity.svg) so the README
      # always has an image, even before the first scheduled run.
      - name: Generate activity card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/activity_card.py "${{ github.repository_owner }}" assets/activity.svg

      - name: Commit activity card if it changed
        run: |
          if git diff --quiet -- assets/activity.svg; then
            echo "Activity card unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity.svg
          git commit -m "chore: refresh activity card"
          git push

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#22D3EE&color_dots=#161B22,#083344,#0E7490,#06B6D4,#67E8F9
            dist/snake-light.svg?palette=github-light&color_snake=#0891B2&color_dots=#EBEDF0,#CFFAFE,#67E8F9,#0891B2,#155E75

      - name: Publish snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
