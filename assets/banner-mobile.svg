<svg xmlns="http://www.w3.org/2000/svg" width="600" height="505" viewBox="0 0 600 505" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Tausif — Full Stack Developer</title>
  <desc id="desc">Web, mobile and AI. Based in Indore, India with over five years of experience.</desc>
  <style>
  .sans{font-family:Arial,Helvetica,sans-serif}.mono{font-family:Menlo,Consolas,'Liberation Mono',monospace}
  .float{animation:float 5s ease-in-out infinite}.pulse{animation:pulse 2.8s ease-in-out infinite}
  .drift{animation:drift 18s linear infinite;transform-origin:center}.scan{animation:scan 3s ease-in-out infinite}
  .nudge{animation:nudge 2.5s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.38}}
  @keyframes drift{to{transform:rotate(360deg)}}
  @keyframes scan{0%,100%{transform:translateY(0);opacity:.45}50%{transform:translateY(35px);opacity:1}}
  @keyframes nudge{0%,100%{transform:translate(0,0)}50%{transform:translate(4px,-4px)}}
  @media(prefers-reduced-motion:reduce){.float,.pulse,.drift,.scan,.nudge{animation:none!important}}
</style>
  
  <rect x=".5" y=".5" width="599" height="504" rx="24" fill="#0E1423" stroke="#34415B"/>
  <circle class="drift" cx="463" cy="355" r="117" stroke="#6DD8CD" stroke-opacity=".18" stroke-dasharray="4 12"/>
  <rect x="32" y="28" width="44" height="44" rx="13" fill="#FF796B"/>
  <text class="sans" x="54" y="57" text-anchor="middle" font-size="25" font-weight="700" fill="#0E1423">T.</text>
  <text class="mono" x="96" y="57" font-size="19" letter-spacing="1" fill="#F8F4EE">TAUSIF / DEV</text>
  <path d="M32 91H568" stroke="#34415B"/>
  <text class="mono" x="32" y="137" font-size="18" letter-spacing="2" fill="#6DD8CD">FULL STACK DEVELOPER</text>
  <text class="sans" x="27" y="241" font-size="116" font-weight="700" letter-spacing="-6" fill="#F8F4EE">Tausif<tspan fill="#FF796B">.</tspan></text>
  <text class="sans" x="32" y="294" font-size="35" font-weight="600" fill="#F8F4EE">Web. Mobile. AI.</text>
  <g class="float">
    <rect x="32" y="325" width="536" height="115" rx="16" fill="#182238" stroke="#485A75"/>
    <path d="M32 359H568" stroke="#34415B"/>
    <circle cx="51" cy="343" r="4" fill="#FF796B"/><circle cx="66" cy="343" r="4" fill="#F4C67D"/><circle cx="81" cy="343" r="4" fill="#6DD8CD"/>
    <text class="mono" x="103" y="348" font-size="15" fill="#B8C2D4">build.tsx</text>
    <text class="mono" x="52" y="400" font-size="21" fill="#FF796B">&lt;idea <tspan fill="#F8F4EE">madeWith="care"</tspan> <tspan fill="#6DD8CD">/&gt;</tspan></text>
  </g>
  <circle class="pulse" cx="41" cy="470" r="5" fill="#6DD8CD"/>
  <text class="mono" x="56" y="476" font-size="17" fill="#B8C2D4">OPEN TO OPPORTUNITIES · INDIA</text>

</svg>
