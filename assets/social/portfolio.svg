<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Portfolio">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B0F17"/><stop offset="1" stop-color="#0D1117"/></linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#fff" fill-opacity=".06"/></pattern>
    <radialGradient id="g" cx="48" cy="0" r="70" gradientUnits="userSpaceOnUse"><stop stop-color="#7C3AED" stop-opacity=".22"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/></radialGradient>
    <linearGradient id="ig" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#FEDA75"/><stop offset=".3" stop-color="#FA7E1E"/><stop offset=".55" stop-color="#D62976"/><stop offset=".8" stop-color="#962FBF"/><stop offset="1" stop-color="#4F5BD5"/></linearGradient>
    <linearGradient id="sw" x1="0" x2="1"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".09"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <clipPath id="c"><rect width="96" height="96" rx="22"/></clipPath>
  </defs>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif}
    .sw{animation:sw 7s ease-in-out 2.50s infinite}
    @keyframes sw{0%{transform:translateX(0)}25%,100%{transform:translateX(220px)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <rect x=".5" y=".5" width="95" height="95" rx="21.5" fill="url(#bg)" stroke="#fff" stroke-opacity=".1"/>
  <rect width="96" height="96" rx="22" fill="url(#g)"/>
  <rect class="sw" x="-90" y="0" width="60" height="96" fill="url(#sw)" clip-path="url(#c)" transform="skewX(-15)"/>
  <g transform="translate(33 20)"><g transform="translate(0 0) scale(1.25)" fill="none" stroke="#A78BFA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></g></g>
  <text x="48" y="77" text-anchor="middle" font-size="12.5" font-weight="600" fill="#CBD5E1">Portfolio</text>
</svg>
