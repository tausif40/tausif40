<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 76" width="384" height="76" role="img" aria-label="LEARNING NOW: AI agents &amp; LLM-powered apps">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B0F17"/><stop offset="1" stop-color="#0D1117"/></linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#fff" fill-opacity=".06"/></pattern></defs>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif} .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
    .nudge{animation:nudge 2.4s ease-in-out infinite}
    @keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(4px)}}
    .ping{transform-box:fill-box;transform-origin:center;animation:ping 2.4s cubic-bezier(0,0,.2,1) infinite}
    @keyframes ping{0%{transform:scale(1);opacity:.6}100%{transform:scale(2.6);opacity:0}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <rect x=".5" y=".5" width="383" height="75" rx="16" fill="url(#bg)" stroke="#fff" stroke-opacity=".1"/>
  <rect x="16" y="16" width="44" height="44" rx="12" fill="#34D399" fill-opacity=".12" stroke="#34D399" stroke-opacity=".35"/>
  <g transform="translate(27 27) scale(0.92)" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 20h10"/><path d="M10 20c5.5-2.5.8-6.4 3-10"/><path d="M9.5 9.4c1.1.8 1.8 2.2 2.3 3.7-2 .4-3.5.4-4.8-.3-1.2-.6-2.3-1.9-3-4.2 2.8-.5 4.4 0 5.5.8z"/><path d="M14.1 6a7 7 0 0 0-1.1 4c1.9-.1 3.3-.6 4.3-1.4 1-1 1.6-2.3 1.7-4.6-2.7.1-4 1-4.9 2z"/></g>
  <text x="74" y="33" class="m" font-size="10.5" font-weight="600" fill="#64748B" letter-spacing="1.6">LEARNING NOW</text>
  <text x="74" y="54" font-size="14.5" font-weight="600" fill="#E2E8F0">AI agents &amp; LLM-powered apps</text>
  
</svg>
