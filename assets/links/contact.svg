<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 76" width="384" height="76" role="img" aria-label="LET'S TALK: Freelance · Full-time · Open source">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B0F17"/><stop offset="1" stop-color="#0D1117"/></linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#fff" fill-opacity=".06"/></pattern></defs>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif} .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
    .nudge{animation:nudge 2.4s ease-in-out infinite}
    @keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(4px)}}
    .ping{transform-box:fill-box;transform-origin:center;animation:ping 2.4s cubic-bezier(0,0,.2,1) infinite}
    @keyframes ping{0%{transform:scale(1);opacity:.6}100%{transform:scale(2.6);opacity:0}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <rect x=".5" y=".5" width="383" height="75" rx="16" fill="url(#bg)" stroke="#fff" stroke-opacity=".1"/>
  <rect x="16" y="16" width="44" height="44" rx="12" fill="#22D3EE" fill-opacity=".12" stroke="#22D3EE" stroke-opacity=".35"/>
  <g transform="translate(27 27) scale(0.92)" fill="none" stroke="#22D3EE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></g>
  <text x="74" y="33" class="m" font-size="10.5" font-weight="600" fill="#64748B" letter-spacing="1.6">LET'S TALK</text>
  <text x="74" y="54" font-size="14.5" font-weight="600" fill="#E2E8F0">Freelance · Full-time · Open source</text>
  <g class="nudge"><path d="M350 33.0 l5 5 -5 5" fill="none" stroke="#22D3EE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
</svg>
