<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 236" width="1200" height="236" role="img" aria-labelledby="t d">
  <title id="t">How I work</title>
  <desc id="d">01 Understand, 02 Plan, 03 Build, 04 Launch.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0E1A"/><stop offset=".6" stop-color="#0D1117"/><stop offset="1" stop-color="#140B26"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE" stop-opacity=".45"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".06"/><stop offset="1" stop-color="#A78BFA" stop-opacity=".5"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" x2="1">
      <stop offset="0" stop-color="#22D3EE"/><stop offset=".35" stop-color="#A78BFA"/><stop offset=".7" stop-color="#F472B6"/><stop offset="1" stop-color="#34D399"/>
    </linearGradient>
  </defs>
  <style>
    .f{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif}
    .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .hl{opacity:0;animation:hl 8s ease-in-out infinite}
    .h2{animation-delay:2s}.h3{animation-delay:4s}.h4{animation-delay:6s}
    @keyframes hl{0%,100%{opacity:0}6%,24%{opacity:1}32%{opacity:0}}
    .dash{stroke-dasharray:6 8;animation:dash 1.2s linear infinite}
    @keyframes dash{to{stroke-dashoffset:-14}}
    .bob{transform-box:fill-box;transform-origin:center;animation:bob 3s ease-in-out infinite}
    .b2{animation-delay:.4s}.b3{animation-delay:.8s}.b4{animation-delay:1.2s}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>

  <rect width="1200" height="236" rx="24" fill="url(#bg)"/>
  <rect x=".75" y=".75" width="1198.5" height="234.5" rx="23.25" fill="none" stroke="url(#edge)" stroke-width="1.5"/>

  <!-- flowing progress rail -->
  <line x1="76" y1="214" x2="1124" y2="214" stroke="url(#flow)" stroke-width="2" stroke-linecap="round" class="dash" opacity=".7"/>

  <g class="f">
    <!-- 01 -->
    <g>
      <rect x="51" y="30" width="255" height="166" rx="16" fill="#ffffff" fill-opacity=".03" stroke="#ffffff" stroke-opacity=".09"/>
      <rect class="hl" x="51" y="30" width="255" height="166" rx="16" fill="#22D3EE" fill-opacity=".05" stroke="#22D3EE" stroke-opacity=".7" stroke-width="1.5"/>
      <rect x="75" y="54" width="48" height="48" rx="12" fill="#22D3EE" fill-opacity=".12" stroke="#22D3EE" stroke-opacity=".35"/>
      <g transform="translate(87 66)"><g class="bob" fill="none" stroke="#22D3EE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.6-4.6"/></g></g>
      <text x="282" y="86" text-anchor="end" class="m" font-size="34" font-weight="800" fill="#22D3EE" fill-opacity=".28">01</text>
      <text x="75" y="140" font-size="22" font-weight="700" fill="#F1F5F9">Understand</text>
      <text x="75" y="166" font-size="15" fill="#94A3B8">Goals, users &amp; scope</text>
      <text x="75" y="186" font-size="15" fill="#94A3B8">mapped out first</text>
    </g>
    <!-- 02 -->
    <g>
      <rect x="332" y="30" width="255" height="166" rx="16" fill="#ffffff" fill-opacity=".03" stroke="#ffffff" stroke-opacity=".09"/>
      <rect class="hl h2" x="332" y="30" width="255" height="166" rx="16" fill="#A78BFA" fill-opacity=".05" stroke="#A78BFA" stroke-opacity=".7" stroke-width="1.5"/>
      <rect x="356" y="54" width="48" height="48" rx="12" fill="#A78BFA" fill-opacity=".12" stroke="#A78BFA" stroke-opacity=".35"/>
      <g transform="translate(368 66)"><g class="bob b2" fill="none" stroke="#A78BFA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></g></g>
      <text x="563" y="86" text-anchor="end" class="m" font-size="34" font-weight="800" fill="#A78BFA" fill-opacity=".28">02</text>
      <text x="356" y="140" font-size="22" font-weight="700" fill="#F1F5F9">Plan</text>
      <text x="356" y="166" font-size="15" fill="#94A3B8">Architecture, stack</text>
      <text x="356" y="186" font-size="15" fill="#94A3B8">&amp; screen flows</text>
    </g>
    <!-- 03 -->
    <g>
      <rect x="613" y="30" width="255" height="166" rx="16" fill="#ffffff" fill-opacity=".03" stroke="#ffffff" stroke-opacity=".09"/>
      <rect class="hl h3" x="613" y="30" width="255" height="166" rx="16" fill="#F472B6" fill-opacity=".05" stroke="#F472B6" stroke-opacity=".7" stroke-width="1.5"/>
      <rect x="637" y="54" width="48" height="48" rx="12" fill="#F472B6" fill-opacity=".12" stroke="#F472B6" stroke-opacity=".35"/>
      <g transform="translate(649 66)"><g class="bob b3" fill="none" stroke="#F472B6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 18 6-6-6-6M8 6l-6 6 6 6"/></g></g>
      <text x="844" y="86" text-anchor="end" class="m" font-size="34" font-weight="800" fill="#F472B6" fill-opacity=".28">03</text>
      <text x="637" y="140" font-size="22" font-weight="700" fill="#F1F5F9">Build</text>
      <text x="637" y="166" font-size="15" fill="#94A3B8">Clean, typed, tested</text>
      <text x="637" y="186" font-size="15" fill="#94A3B8">code that scales</text>
    </g>
    <!-- 04 -->
    <g>
      <rect x="894" y="30" width="255" height="166" rx="16" fill="#ffffff" fill-opacity=".03" stroke="#ffffff" stroke-opacity=".09"/>
      <rect class="hl h4" x="894" y="30" width="255" height="166" rx="16" fill="#34D399" fill-opacity=".05" stroke="#34D399" stroke-opacity=".7" stroke-width="1.5"/>
      <rect x="918" y="54" width="48" height="48" rx="12" fill="#34D399" fill-opacity=".12" stroke="#34D399" stroke-opacity=".35"/>
      <g transform="translate(930 66)"><g class="bob b4" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/></g></g>
      <text x="1125" y="86" text-anchor="end" class="m" font-size="34" font-weight="800" fill="#34D399" fill-opacity=".28">04</text>
      <text x="918" y="140" font-size="22" font-weight="700" fill="#F1F5F9">Launch</text>
      <text x="918" y="166" font-size="15" fill="#94A3B8">Deploy, monitor &amp;</text>
      <text x="918" y="186" font-size="15" fill="#94A3B8">post-launch support</text>
    </g>

    <!-- connectors -->
    <g fill="#0D1117" stroke="#ffffff" stroke-opacity=".18">
      <circle cx="319" cy="113" r="12"/><circle cx="600" cy="113" r="12"/><circle cx="881" cy="113" r="12"/>
    </g>
    <g fill="none" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="m316 108 5 5-5 5"/><path d="m597 108 5 5-5 5"/><path d="m878 108 5 5-5 5"/>
    </g>
  </g>
</svg>
